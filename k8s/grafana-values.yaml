
# Настройки Grafana для лабораторной работы

replicas: 1

# Временное хранилище для Killercoda
persistence:
    enabled: false

# Доступ к Grafana внутри Kubernetes
service:
    type: ClusterIP
    port: 80

# Ограничения ресурсов
resources:
    requests:
        memory: 128Mi
        cpu: 50m
    limits:
        memory: 512Mi
        cpu: 500m

# Автоматическое подключение Prometheus

datasources:
    datasources.yaml:
        apiVersion: 1
        datasources:
            - name: Prometheus
              uid: prometheus
              type: prometheus
              access: proxy
              url: http://prometheus.monitoring.svc.cluster.local:9090
              isDefault: true
              editable: true

            - name: Elasticsearch
              uid: elasticsearch
              type: elasticsearch
              access: proxy
              url: http://elasticsearch.monitoring.svc.cluster.local:9200
              isDefault: false
              editable: true
              jsonData:
                  index: "logstash-*"
                  timeField: "@timestamp"
                  logMessageField: "log"

            - name: Jaeger
              uid: jaeger
              type: jaeger
              access: proxy
              url: http://jaeger.monitoring.svc.cluster.local:16686
              isDefault: false
              editable: true


alerting:
    rules.yaml:
        apiVersion: 1
        groups:
            - orgId: 1
              name: JVM Alerts
              folder: Monitoring
              interval: 10s
              rules:
                  - uid: jvm_heap_80
                    title: JVM Heap Usage Above 80%
                    condition: B
                    data:
                        - refId: A
                          datasourceUid: prometheus
                          relativeTimeRange:
                              from: 60
                              to: 0
                          model:
                              datasource:
                                  type: prometheus
                                  uid: prometheus
                              editorMode: code
                              expr: |
                                  100 *
                                  sum by (job, instance) (
                                    jvm_memory_used_bytes{job="grafana-demo",area="heap"}
                                  )
                                  /
                                  sum by (job, instance) (
                                    jvm_memory_max_bytes{job="grafana-demo",area="heap",id="G1 Old Gen"}
                                  )
                              instant: true
                              range: false
                              intervalMs: 1000
                              maxDataPoints: 43200
                              refId: A

                        - refId: B
                          datasourceUid: __expr__
                          relativeTimeRange:
                              from: 60
                              to: 0
                          model:
                              datasource:
                                  type: __expr__
                                  uid: __expr__
                              expression: A
                              type: threshold
                              conditions:
                                  - evaluator:
                                        type: gt
                                        params: [80]
                                    operator:
                                        type: and
                                    query:
                                        params: [B]
                                    reducer:
                                        type: last
                                        params: []
                                    type: query
                              intervalMs: 1000
                              maxDataPoints: 43200
                              refId: B

                    for: 30s
                    noDataState: NoData
                    execErrState: Error
                    isPaused: false
                    annotations:
                        summary: JVM Heap usage exceeded 80%
                    labels:
                        severity: warning
