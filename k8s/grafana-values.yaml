
# Настройки Grafana для лабораторной работы

replicas: 1

# Временное хранилище для Killercoda
persistence:
    enabled: false

# Доступ к Grafana внутри Kubernetes
service:
    type: ClusterIP
    port: 80

# Ограничения ресурсов
resources:
    requests:
        memory: 128Mi
        cpu: 50m
    limits:
        memory: 512Mi
        cpu: 500m

# Автоматическое подключение Prometheus

datasources:
    datasources.yaml:
        apiVersion: 1
        datasources:
            - name: Prometheus
              uid: prometheus
              type: prometheus
              access: proxy
              url: http://prometheus.monitoring.svc.cluster.local:9090
              isDefault: true
              editable: true

            - name: Elasticsearch
              uid: elasticsearch
              type: elasticsearch
              access: proxy
              url: http://elasticsearch.monitoring.svc.cluster.local:9200
              isDefault: false
              editable: true
              jsonData:
                  index: "logstash-*"
                  timeField: "@timestamp"
                  logMessageField: "log"

            - name: Jaeger
              uid: jaeger
              type: jaeger
              access: proxy
              url: http://jaeger.monitoring.svc.cluster.local:16686
              isDefault: false
              editable: true


