
apiVersion: v1
kind: ConfigMap
metadata:
    name: prometheus-config
    namespace: monitoring
data:
    prometheus.yml: |
        global:
          scrape_interval: 10s

        scrape_configs:
          - job_name: "prometheus"
            static_configs:
              - targets: ["localhost:9090"]

          - job_name: "grafana-demo"
            metrics_path: /actuator/prometheus
            static_configs:
              - targets:
                  - "grafana-demo.monitoring.svc.cluster.local:8080"
---
apiVersion: apps/v1
kind: Deployment
metadata:
    name: prometheus
    namespace: monitoring
spec:
    replicas: 1
    selector:
        matchLabels:
            app: prometheus
    template:
        metadata:
            labels:
                app: prometheus
        spec:
            containers:
                - name: prometheus
                  image: prom/prometheus:v3.16.0
                  args:
                      - "--config.file=/etc/prometheus/prometheus.yml"
                      - "--storage.tsdb.path=/prometheus"
                      - "--storage.tsdb.retention.time=2h"
                  ports:
                      - containerPort: 9090
                        name: web
                  resources:
                      requests:
                          memory: "128Mi"
                          cpu: "100m"
                      limits:
                          memory: "512Mi"
                          cpu: "500m"
                  volumeMounts:
                      - name: config
                        mountPath: /etc/prometheus
                        readOnly: true
                      - name: data
                        mountPath: /prometheus
            volumes:
                - name: config
                  configMap:
                      name: prometheus-config
                - name: data
                  emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
    name: prometheus
    namespace: monitoring
spec:
    selector:
        app: prometheus
    ports:
        - name: web
          port: 9090
          targetPort: web
    type: ClusterIP
