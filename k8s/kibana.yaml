
apiVersion: apps/v1
kind: Deployment
metadata:
    name: kibana
    namespace: monitoring
spec:
    replicas: 1
    selector:
        matchLabels:
            app: kibana
    template:
        metadata:
            labels:
                app: kibana
        spec:
            containers:
                - name: kibana
                  image: docker.elastic.co/kibana/kibana:8.19.25

                  ports:
                      - name: http
                        containerPort: 5601

                  env:
                      - name: ELASTICSEARCH_HOSTS
                        value: '["http://elasticsearch.monitoring.svc.cluster.local:9200"]'

                      - name: SERVER_HOST
                        value: "0.0.0.0"

                      - name: NODE_OPTIONS
                        value: "--max-old-space-size=768"

                  resources:
                      requests:
                          memory: "512Mi"
                          cpu: "100m"
                      limits:
                          memory: "1536Mi"
                          cpu: "1000m"

                  startupProbe:
                      tcpSocket:
                          port: http
                      periodSeconds: 5
                      failureThreshold: 48

---
apiVersion: v1
kind: Service
metadata:
    name: kibana
    namespace: monitoring
spec:
    selector:
        app: kibana
    ports:
        - name: http
          port: 5601
          targetPort: http
    type: ClusterIP
