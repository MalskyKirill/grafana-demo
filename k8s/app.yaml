
apiVersion: v1
kind: Namespace
metadata:
    name: monitoring
---
apiVersion: apps/v1
kind: Deployment
metadata:
    name: grafana-demo
    namespace: monitoring
spec:
    replicas: 1
    selector:
        matchLabels:
            app: grafana-demo
    template:
        metadata:
            labels:
                app: grafana-demo
            annotations:
                prometheus.io/scrape: "true"
                prometheus.io/path: "/actuator/prometheus"
                prometheus.io/port: "8080"
        spec:
            containers:
                - name: grafana-demo
                  image: malskykirill/grafana-demo:1.0
                  imagePullPolicy: IfNotPresent
                  ports:
                      - name: http
                        containerPort: 8080
                  env:
                      - name: JAVA_TOOL_OPTIONS
                        value: "-Xms128m -Xmx256m"
                  resources:
                      requests:
                          memory: "384Mi"
                          cpu: "100m"
                      limits:
                          memory: "512Mi"
                          cpu: "500m"
                  startupProbe:
                      httpGet:
                          path: /actuator/health/liveness
                          port: http
                      periodSeconds: 5
                      failureThreshold: 24
                  readinessProbe:
                      httpGet:
                          path: /actuator/health/readiness
                          port: http
                      periodSeconds: 5
                  livenessProbe:
                      httpGet:
                          path: /actuator/health/liveness
                          port: http
                      periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
    name: grafana-demo
    namespace: monitoring
spec:
    selector:
        app: grafana-demo
    ports:
        - name: http
          port: 8080
          targetPort: http
    type: ClusterIP
